<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo — Empresas</title>
    <script type="module" src="./main.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <main class="mx-auto max-w-5xl p-4 sm:p-6">
      <header class="mb-4 flex flex-wrap items-end justify-between gap-2">
        <div>
          <h1 class="text-xl font-semibold">Empresas</h1>
          <p class="text-sm text-slate-500">Exemplo — testa a conexão lendo <code>TSIEMP</code></p>
        </div>
        <span id="ambiente" class="rounded-full px-3 py-1 text-xs font-medium"></span>
      </header>

      <section id="parametros" class="mb-4 flex flex-wrap gap-2 text-xs"></section>

      <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2 text-sm">
          <span id="status" class="text-slate-500">Carregando…</span>
          <button id="recarregar" class="rounded-md border border-slate-300 px-3 py-1 hover:bg-slate-100">Recarregar</button>
        </div>
        <div id="erro" class="hidden border-b border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-xs uppercase text-slate-500">
              <tr><th class="px-4 py-2 w-24">CODEMP</th><th class="px-4 py-2">NOMEFANTASIA</th></tr>
            </thead>
            <tbody id="linhas" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
